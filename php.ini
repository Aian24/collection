; PHP settings for Bluehost shared hosting
; Optimized to prevent background process buildup
; These values override .user.ini since php.ini loads last

display_errors = Off
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
memory_limit = 256M
post_max_size = 128M
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/ea-php83"
upload_max_filesize = 128M
zlib.output_compression = On
max_file_uploads = 100
session.lazy_write = 1
